name: Update Versions
on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci

      # Current version, release date, and end-of-life date from
      # endoflife.date, plus the Wikidata ID for Google's Knowledge Graph.
      - run: npm run update:versions

      # The schema must pass validation; otherwise, no PR will be created.
      - run: npm run check

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/versions
          title: Update distribution versions
          commit-message: 'chore(versions): update versions from Wikidata and endoflife.date'
          labels: automated
          body: |
            Version data is automatically updated weekly from the following sources:

            - `endoflife.date` — current version, release date, and end-of-life date
            - Wikidata — entity ID used for `sameAs`

            Please review the changes before merging. If a source does not
            provide data, the field is left empty and the page displays
            "Under Review".
